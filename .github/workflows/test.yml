name: Test container image

on: [pull_request, workflow_call]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build image
              run: docker build --file Containerfile --tag container-port-forward:test .

            - name: Test image
              run: sh tests/test-container.sh